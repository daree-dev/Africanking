name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrations:
    name: Database migration integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/coop_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Apply full migration chain (first run)
        run: |
          for f in $(ls database/migrations/*.sql | sort); do
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Load sanitized legacy fixture and verify backfill
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/fixtures/legacy_sanitized.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/verify_backfill.sql

      - name: Verify indexes, constraints, RLS enablement and policies
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/verify_schema.sql

      - name: Re-run migrations (repeat-run safety)
        run: |
          for f in $(ls database/migrations/*.sql | sort); do
            echo "Re-applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/verify_schema.sql
