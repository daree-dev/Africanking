name: Staging Release & Promotion Gates

# ------------------------------------------------------------------ #
# Trigger: push to develop runs staging gates automatically.          #
# Production promotion: manual workflow_dispatch with approval.       #
# ------------------------------------------------------------------ #
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment to promote to"
        required: true
        type: choice
        options:
          - staging
          - production
      confirm_manifest:
        description: "I have verified contract IDs in contract-manifest.json match the deployed contracts"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write
  pull-requests: write

# ------------------------------------------------------------------ #
# Job 1 — Build                                                       #
# ------------------------------------------------------------------ #
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all apps
        run: pnpm turbo build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STELLAR_NETWORK: TESTNET
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_ENERGY_TOKEN_CONTRACT: ${{ vars.STAGING_ENERGY_TOKEN_CONTRACT }}
          NEXT_PUBLIC_ENERGY_DISTRIBUTION_CONTRACT: ${{ vars.STAGING_ENERGY_DISTRIBUTION_CONTRACT }}
          NEXT_PUBLIC_COMMUNITY_GOVERNANCE_CONTRACT: ${{ vars.STAGING_COMMUNITY_GOVERNANCE_CONTRACT }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: apps/web/.next
          retention-days: 1

  # ------------------------------------------------------------------ #
  # Job 2 — Tests                                                       #
  # ------------------------------------------------------------------ #
  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        working-directory: apps/api
        run: pnpm test:api

  # ------------------------------------------------------------------ #
  # Job 3 — Migration check                                             #
  # Validates that all Supabase migrations are consistent with the      #
  # schema before promoting.                                            #
  # ------------------------------------------------------------------ #
  migration-check:
    name: Migration Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check migration files are present
        run: |
          if [ -d "supabase/migrations" ]; then
            COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)
            echo "Found $COUNT migration file(s)."
          else
            echo "No supabase/migrations directory — skipping migration check."
          fi

      - name: Validate no uncommitted migration conflicts
        run: |
          # Ensure migration filenames follow the timestamp convention and are sorted
          if [ -d "supabase/migrations" ]; then
            SORTED=$(ls supabase/migrations/*.sql 2>/dev/null | sort)
            echo "Migration order:"
            echo "$SORTED"
          fi

  # ------------------------------------------------------------------ #
  # Job 4 — Contract manifest check                                     #
  # Verifies the deployed contract IDs match contract-manifest.json.    #
  # ------------------------------------------------------------------ #
  contract-manifest-check:
    name: Contract Manifest Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest schema
        run: |
          python3 -c "
          import json, sys
          with open('contract-manifest.json') as f:
              manifest = json.load(f)
          envs = manifest.get('environments', {})
          for env_name, env in envs.items():
              contracts = env.get('contracts', {})
              for name, addr in contracts.items():
                  if addr and not addr.startswith('<'):
                      # Basic Stellar contract ID check: 56 chars, starts with C
                      if not (len(addr) == 56 and addr[0] == 'C'):
                          print(f'WARN: {env_name}.{name} = {addr!r} does not look like a valid Soroban contract ID')
          print('Contract manifest validation passed.')
          "

      - name: Check staging contracts match env vars
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'staging')
        env:
          STAGING_ENERGY_TOKEN: ${{ vars.STAGING_ENERGY_TOKEN_CONTRACT }}
          STAGING_DISTRIBUTION: ${{ vars.STAGING_ENERGY_DISTRIBUTION_CONTRACT }}
          STAGING_GOVERNANCE: ${{ vars.STAGING_COMMUNITY_GOVERNANCE_CONTRACT }}
        run: |
          python3 -c "
          import json, os, sys
          with open('contract-manifest.json') as f:
              manifest = json.load(f)
          staging = manifest['environments'].get('staging', {}).get('contracts', {})
          checks = {
              'energy_token': os.environ.get('STAGING_ENERGY_TOKEN', ''),
              'energy_distribution': os.environ.get('STAGING_DISTRIBUTION', ''),
              'community_governance': os.environ.get('STAGING_GOVERNANCE', ''),
          }
          mismatches = []
          for key, env_val in checks.items():
              manifest_val = staging.get(key, '')
              # Skip check if manifest entry is a placeholder or empty
              if not manifest_val or manifest_val.startswith('<'):
                  print(f'SKIP: {key} not set in manifest yet')
                  continue
              if env_val and env_val != manifest_val:
                  mismatches.append(f'{key}: manifest={manifest_val!r}, env={env_val!r}')
          if mismatches:
              print('CONTRACT MANIFEST MISMATCH:')
              for m in mismatches:
                  print(f'  {m}')
              sys.exit(1)
          print('Contract manifest check passed.')
          "

      - name: Require manual confirmation for production
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'production'
        run: |
          if [ "${{ github.event.inputs.confirm_manifest }}" != "true" ]; then
            echo "::error::Production promotion requires confirm_manifest=true. Verify contract IDs in contract-manifest.json first."
            exit 1
          fi
          echo "Production manifest confirmation received."

  # ------------------------------------------------------------------ #
  # Job 5 — Deploy to Staging                                           #
  # Runs only on develop push or staging workflow_dispatch.             #
  # ------------------------------------------------------------------ #
  deploy-staging:
    name: Deploy → Staging
    needs: [build, test, migration-check, contract-manifest-check]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'staging')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (Staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel --quiet
          vercel deploy --token "$VERCEL_TOKEN" \
            --env NEXT_PUBLIC_STELLAR_NETWORK=TESTNET \
            --env NEXT_PUBLIC_SUPABASE_URL="${{ vars.STAGING_SUPABASE_URL }}" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.STAGING_SUPABASE_ANON_KEY }}" \
            --env NEXT_PUBLIC_ENERGY_TOKEN_CONTRACT="${{ vars.STAGING_ENERGY_TOKEN_CONTRACT }}" \
            --env NEXT_PUBLIC_ENERGY_DISTRIBUTION_CONTRACT="${{ vars.STAGING_ENERGY_DISTRIBUTION_CONTRACT }}" \
            --env NEXT_PUBLIC_COMMUNITY_GOVERNANCE_CONTRACT="${{ vars.STAGING_COMMUNITY_GOVERNANCE_CONTRACT }}" \
            2>&1 | tee vercel-deploy.log
          DEPLOY_URL=$(grep -oP 'https://[^\s]+\.vercel\.app' vercel-deploy.log | tail -1)
          echo "STAGING_DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Staging deployed to: $DEPLOY_URL"

      - name: Post-deployment verification
        run: |
          if [ -z "$STAGING_DEPLOY_URL" ]; then
            echo "WARN: Could not parse deploy URL from Vercel output. Skipping smoke test."
            exit 0
          fi
          echo "Running smoke test against $STAGING_DEPLOY_URL ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_DEPLOY_URL")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staging smoke test failed — HTTP $STATUS"
            exit 1
          fi
          echo "Staging smoke test passed (HTTP $STATUS)."

  # ------------------------------------------------------------------ #
  # Job 6 — Promote to Production                                       #
  # Manual trigger only; requires environment approval in GitHub.       #
  # ------------------------------------------------------------------ #
  deploy-production:
    name: Deploy → Production
    needs: [build, test, migration-check, contract-manifest-check]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target_environment == 'production' &&
      github.event.inputs.confirm_manifest == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Promote Vercel deployment to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel --quiet
          vercel deploy --prod --token "$VERCEL_TOKEN" \
            --env NEXT_PUBLIC_STELLAR_NETWORK=PUBLIC \
            --env NEXT_PUBLIC_SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --env NEXT_PUBLIC_ENERGY_TOKEN_CONTRACT="${{ vars.PROD_ENERGY_TOKEN_CONTRACT }}" \
            --env NEXT_PUBLIC_ENERGY_DISTRIBUTION_CONTRACT="${{ vars.PROD_ENERGY_DISTRIBUTION_CONTRACT }}" \
            --env NEXT_PUBLIC_COMMUNITY_GOVERNANCE_CONTRACT="${{ vars.PROD_COMMUNITY_GOVERNANCE_CONTRACT }}" \
            2>&1 | tee vercel-prod.log
          PROD_URL=$(grep -oP 'https://[^\s]+\.vercel\.app' vercel-prod.log | tail -1)
          echo "PROD_DEPLOY_URL=$PROD_URL" >> "$GITHUB_ENV"
          echo "Production deployed to: $PROD_URL"

      - name: Post-deployment verification
        run: |
          TARGET="${PROD_DEPLOY_URL:-${{ vars.PRODUCTION_URL }}}"
          echo "Running smoke test against $TARGET ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Production smoke test failed — HTTP $STATUS"
            exit 1
          fi
          echo "Production smoke test passed (HTTP $STATUS)."

      - name: Create release tag
        run: |
          TAG="release/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "Production release $TAG"
          git push origin "$TAG"
