name: Accessibility & Visual Regression

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/accessibility-visual.yml"
  push:
    branches: [develop]
    paths:
      - "apps/web/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  # ------------------------------------------------------------------ #
  # Axe accessibility audit on critical screens                         #
  # Covered screens (issue #112):                                       #
  #   - /login             — login page                                 #
  #   - /dashboard         — main cooperative dashboard                 #
  #   - /dashboard/cooperative/members — member management              #
  #   - /dashboard/cooperative (meters tab) — meter management          #
  # ------------------------------------------------------------------ #
  accessibility:
    name: Axe Accessibility Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - name: Build Next.js app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY || 'placeholder' }}
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
        run: npm run build

      - name: Install Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Install @axe-core/playwright
        working-directory: apps/web
        run: npm install --save-dev @axe-core/playwright@^4 @playwright/test@latest --legacy-peer-deps

      - name: Run accessibility checks
        working-directory: apps/web
        run: npx playwright test --config=playwright-a11y.config.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-accessibility-report
          path: apps/web/playwright-report/
          retention-days: 14

  # ------------------------------------------------------------------ #
  # Visual regression snapshots at three viewport widths                #
  # Viewports (issue #112):                                             #
  #   - 375 × 812   — mobile (iPhone SE)                               #
  #   - 768 × 1024  — tablet (iPad portrait)                           #
  #   - 1440 × 900  — desktop                                          #
  # ------------------------------------------------------------------ #
  visual-regression:
    name: Visual Regression (Storybook / Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Install visual testing dependencies
        working-directory: apps/web
        run: npm install --save-dev @playwright/test@latest --legacy-peer-deps

      - name: Build Next.js app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY || 'placeholder' }}
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
        run: npm run build

      - name: Run visual regression tests
        working-directory: apps/web
        run: npx playwright test --config=playwright-visual.config.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            apps/web/test-results/
            apps/web/__snapshots__/
          retention-days: 7

      - name: Comment diff on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Visual regression detected.** Download the `visual-regression-diffs` artifact from this run to review screenshots before updating baselines. Do not auto-update snapshots without manual review.'
            })
